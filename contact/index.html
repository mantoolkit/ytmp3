<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="description" content="Kirimkan pesan kepada kami jika Anda memiliki pertanyaan atau masalah."><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YTMP3:&nbsp;Contact</title><style>body{background-color:#161515;font-family:Arial,sans-serif;font-size:14px;margin:0}input,textarea{font-family:Arial,sans-serif}.header{max-width:600px;margin:0 auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between}.header a{color:#fff;text-decoration:none;margin-right:16px}.header a:last-child{margin-right:0}.header-logo{font-size:22px;font-weight:900;letter-spacing:-1px}.text{max-width:600px;margin:32px auto 0 auto}.text h1{color:#fff;font-size:24px;font-weight:400;line-height:24px;margin:0}.text p{color:#9d9d9d;line-height:24px;margin:16px 0 0 0}.text a{color:#9d9d9d}.card{background-color:#252525;border:1px solid #333;border-radius:8px;margin-top:16px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}.card label{color:#fff;font-weight:700;display:block;margin-bottom:4px}.card input,.card textarea{color:#fff;background-color:#191919;font-size:14px;width:100%;border:1px solid #3a3a3a;border-radius:4px;box-sizing:border-box;outline:0}.card input{height:44px;padding:0 12px}.card textarea{height:140px;padding:12px;resize:none}.card input:focus,.card textarea:focus{border-color:#d32f2f}.card button[type=submit]{color:#fff;background-color:#d32f2f;font-family:Arial,sans-serif;font-size:14px;font-weight:700;height:44px;border:none;border-radius:4px;cursor:pointer;width:100%}.card button[type=submit]:hover{background-color:#b71c1c}.card button[type=submit]:disabled{background-color:#444;cursor:not-allowed}#success-msg{display:none;color:#4cae4c;background:#1a2e1a;border:1px solid #2d5a2d;border-radius:6px;padding:12px 16px;margin-top:12px;text-align:center}#error-msg{display:none;color:#ff5f5f;background:#2e1a1a;border:1px solid #5a2d2d;border-radius:6px;padding:12px 16px;margin-top:12px;text-align:center}.footer{color:#9d9d9d;max-width:600px;border-top:1px solid #1d1d1d;margin:48px auto 0 auto;padding:24px 0;display:flex;justify-content:space-between;align-items:center}.footer a{color:#9d9d9d;text-decoration:none}.footer a:hover{color:#fff}@media only screen and (max-width:600px){.header{margin:0 4%}.header a:nth-of-type(3){display:none}.text{margin:32px 4% 0 4%}.footer{margin:64px 4% 0 4%;color:#9d9d9d}}</style></head><body><div class="header"><div><img src="/svg/logo.svg" width="90" height="44" alt="YTMP3"></div><div><a href="/">Home</a><a href="/faq/">FAQ</a></div></div><div class="text"><h1>Contact</h1><p>Punya pertanyaan atau masalah? Isi formulir di bawah ini dan kami akan menghubungi Anda sesegera mungkin.</p><div class="card"><div><label for="name">Name</label><input type="text" id="name" placeholder="Your name" required></div><div><label for="email">Email</label><input type="email" id="email" placeholder="your@email.com" required></div><div><label for="subject">Subject</label><input type="text" id="subject" placeholder="Subject" required></div><div><label for="message">Message</label><textarea id="message" placeholder="Your message..." required></textarea></div><button type="submit" id="btn-send" onclick="sendForm()">Send Message</button></div><div id="success-msg">✓ Pesan Anda telah terkirim. Kami akan segera menghubungi Anda kembali.</div><div id="error-msg">Terjadi kesalahan. Silakan coba lagi.</div></div><div class="footer"><span>&copy;&nbsp;<span id="current-year"></span>&nbsp;YTMP3</span><a href="/contact/">Contact Us</a></div><script>document.getElementById("current-year").textContent = new Date().getFullYear();</script><script>function sendForm(){const name=document.getElementById("name").value.trim();const email=document.getElementById("email").value.trim();const subject=document.getElementById("subject").value.trim();const message=document.getElementById("message").value.trim();if(!name||!email||!subject||!message)return;document.getElementById("btn-send").disabled=!0;document.getElementById("btn-send").textContent="Sending...";document.getElementById("error-msg").style.display="none";fetch("https://formspree.io/f/xrpgwykk",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name,email,subject,message})}).then(r=>r.json()).then(data=>{if(data.ok){document.getElementById("success-msg").style.display="block";document.getElementById("name").value="";document.getElementById("email").value="";document.getElementById("subject").value="";document.getElementById("message").value=""}else{document.getElementById("error-msg").style.display="block"}}).catch(()=>{document.getElementById("error-msg").style.display="block"}).finally(()=>{document.getElementById("btn-send").disabled=!1;document.getElementById("btn-send").textContent="Send Message"})}</script></body></html>
